<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../promo.css">
  <style>
    /* Instagram portrait, 1080x1350 */
    html, body { width: 1080px; height: 1350px; }
    .wall-night {
      background:
        radial-gradient(40% 30% at 22% 8%, rgba(255, 212, 121, .28), transparent 70%),
        radial-gradient(60% 40% at 80% 45%, rgba(16, 150, 115, .5), transparent 70%),
        radial-gradient(55% 35% at 15% 78%, rgba(30, 64, 175, .42), transparent 70%),
        linear-gradient(175deg, #050b1c, #06201f 55%, #040812);
    }
    .copy { left: 70px; right: 70px; top: 70px; text-align: center; }
    .copy .brand { justify-content: center; }
    h1 { margin-top: 34px; font-size: 84px; line-height: 1.15; }
    h1 .hl { background: linear-gradient(90deg, #a7f3d0, #5eead4 45%, #ffd479); -webkit-background-clip: text; color: transparent; }
    .copy p { margin-top: 20px; font-size: 29px; line-height: 1.6; }
    .tag {
      display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; height: 46px; padding: 0 20px; border-radius: 99px;
      background: rgba(255, 69, 58, .16); box-shadow: inset 0 0 0 1px rgba(255, 69, 58, .35); color: #ffb4ad; font-size: 21px; font-weight: 700;
    }
    .tag i { width: 10px; height: 10px; border-radius: 50%; background: #ff453a; box-shadow: 0 0 0 6px rgba(255, 69, 58, .18); }
    .callout .label { text-align: center; }
    .bottom { position: absolute; left: 70px; right: 70px; top: 1110px; direction: rtl; text-align: center; }
    .bottom .chips { justify-content: center; margin-top: 0; }
    .bottom .chips span { font-size: 20px; }
    .bottom .chips span b { --c: #5eead4; }
    .how {
      margin-top: 30px; font-size: 22px; color: var(--txt-2);
    }
    .how b { color: #fff; font-weight: 600; direction: ltr; unicode-bidi: isolate; font-family: var(--ui); }
    .free { color: #4ade80; font-weight: 700; }
    .crescent { width: 120px; height: 120px; }
  </style>
</head>
<body>
  <div class="wall wall-night"></div>
  <div class="stars"></div>
  <div class="crescent" style="left: 90px; top: 70px;"></div>

  <div class="copy">
    <div class="brand"><span class="mark"><i></i></span>Nova Island</div>
    <h1>إذاعة القرآن الكريم<br><span class="hl">على جزيرتك</span></h1>
    <p>بثّ مباشر من القاهرة والسعودية وأكثر من ١٧٠ قارئًا، يعمل في الخلفية دون أن تفتح متصفحًا.</p>
    <div class="tag"><i></i>إضافة جديدة · مجانية</div>
  </div>

  <!--ISLANDS-->

  <div class="bottom">
    <div class="chips">
      <span><b></b>تبويب خاص بالإذاعة</span>
      <span><b></b>يعمل في الخلفية</span>
      <span><b></b>يتوقف وقت الصلاة إن أردت</span>
    </div>
    <div class="how">للتثبيت: <b>Settings → Plugins → Install</b> · <span class="free">مجانًا</span></div>
  </div>
  <script src="../mock.js"></script>
  <script src="../scene.js"></script>
</body>
</html>
