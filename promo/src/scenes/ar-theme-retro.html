<!doctype html>
<html lang="ar">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../promo.css">
  <style>
    html, body { width: 1080px; height: 1350px; }
    .bgw { position: absolute; inset: 0; background: radial-gradient(50% 35% at 80% 15%, rgba(74,222,128,.22), transparent 70%), repeating-linear-gradient(0deg, rgba(74,222,128,.05) 0 2px, transparent 2px 6px), linear-gradient(175deg,#040a06,#06140c 55%,#020503); }
    .copy { left: 70px; right: 70px; top: 70px; text-align: center; }
    .copy .brand { justify-content: center; }
    .kicker { margin-top: 30px; font-size: 24px; color: var(--txt-2); font-weight: 500; }
    h1 { margin-top: 24px; font-size: 104px; line-height: 1.1; }
    h1 .hl { background: linear-gradient(90deg,#86efac,#4ade80); -webkit-background-clip: text; color: transparent; }
    h1 small { display: block; margin-top: 18px; font: 600 26px var(--ui); letter-spacing: .12em; color: var(--txt-3); }
    .line { margin-top: 18px; font-size: 40px; font-weight: 600; }
    .copy p { margin-top: 8px; font-size: 25px; }
    .cap { position: absolute; left: 0; right: 0; direction: rtl; text-align: center; font-size: 20px; color: var(--txt-3); font-weight: 500; }
    .more { position: absolute; left: 0; right: 0; top: 1205px; direction: rtl; text-align: center; }
    .more .n { display: inline-flex; align-items: center; gap: 10px; height: 56px; padding: 0 26px; border-radius: 99px; font-size: 26px; font-weight: 700;
               background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px var(--stroke); }
    .more .n b { font-weight: 700; background: linear-gradient(90deg,#86efac,#4ade80); -webkit-background-clip: text; color: transparent; }
    .more .how { margin-top: 14px; font-size: 20px; color: var(--txt-2); }
    .more .how i { font-style: normal; direction: ltr; unicode-bidi: isolate; font-family: var(--ui); color: #fff; }
  </style>
</head>
<body>
  <div class="bgw"></div>
  <div class="stars"></div>
  <div class="copy">
    <div class="brand"><span class="mark"><i></i></span>Nova Island</div>
    <div class="kicker">ثيم جديد للجزيرة</div>
    <h1><span class="hl">ريترو</span><small>RETRO</small></h1>
    <div class="line">حنين ألعاب البكسل</div>
    <p>زوايا حادة، وخط مبرمجين، وأخضر الشاشات القديمة.</p>
  </div>
  <div class="cap" style="top:610px">مصغّرة</div>
  <div class="cap" style="top:752px">مفتوحة</div>
  <!--ISLANDS-->
  <div class="more">
    <div class="n">+ <b>١٢ ثيمًا آخر</b> مجانًا</div>
    <div class="how">من <i>Settings → Themes</i> · Nova Island 1.6</div>
  </div>
  <script src="../mock.js"></script>
  <script src="../scene.js"></script>
</body>
</html>
